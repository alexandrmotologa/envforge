<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Icon: Layered Isometric Parity Cubes / Anvil -->
  <g transform="translate(60, 45)">
    <!-- Bottom layer -->
    <path d="M 55 75 L 95 95 L 55 115 L 15 95 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M 15 95 L 55 115 L 55 125 L 15 105 Z" fill="#0f172a" />
    <path d="M 55 115 L 95 95 L 95 105 L 55 125 Z" fill="#1e293b" />

    <!-- Middle layer -->
    <path d="M 55 45 L 95 65 L 55 85 L 15 65 Z" fill="url(#blueGrad)" opacity="0.85" filter="url(#glow)"/>
    <path d="M 15 65 L 55 85 L 55 95 L 15 75 Z" fill="#1d4ed8" />
    <path d="M 55 85 L 95 65 L 95 75 L 55 95 Z" fill="#2563eb" />

    <!-- Top floating layer -->
    <path d="M 55 15 L 95 35 L 55 55 L 15 35 Z" fill="url(#cyanGrad)" filter="url(#glow)"/>
    <path d="M 15 35 L 55 55 L 55 65 L 15 45 Z" fill="#0284c7" />
    <path d="M 55 55 L 95 35 L 95 45 L 55 65 Z" fill="#0369a1" />

    <!-- Inner Core Dot -->
    <circle cx="55" cy="35" r="4" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="195" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Env<tspan fill="#38bdf8">Forge</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="198" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Configuration &amp; Secret Parity Auditor • AST Code Scanner • Type-Safe Zod Synthesizer
  </text>
</svg>
